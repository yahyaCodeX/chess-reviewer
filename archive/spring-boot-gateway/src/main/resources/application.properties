spring.application.name=chess-review-api

# ==========================================
# POSTGRESQL (AIVEN)
# ==========================================
# Replace this URL with your Aiven Postgres Service URI. Make sure it ends in ?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chessdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# KAFKA (AIVEN)
# KAFKA (AIVEN)
# ==========================================
spring.kafka.bootstrap-servers=chess-kafka-siddiquiyahya796-e171.b.aivencloud.com:23570
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Tell Kafka to use SSL
spring.kafka.properties.security.protocol=SSL

# Tell Spring Boot to use the "aiven" SSL bundle defined below
spring.kafka.ssl.bundle=aiven

# Define the "aiven" SSL bundle (Spring Boot handles the classpath magic!)
spring.ssl.bundle.pem.aiven.truststore.certificate=classpath:certs/ca.pem
spring.ssl.bundle.pem.aiven.keystore.certificate=classpath:certs/service.cert
spring.ssl.bundle.pem.aiven.keystore.private-key=classpath:certs/service.key
