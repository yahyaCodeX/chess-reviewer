# Backend stack for one Azure VM (B2s: 2 vCPU, 4 GB RAM).
# The website itself is hosted separately on Vercel.
#
#   caddy    → HTTPS (free Let's Encrypt certificate) in front of the API
#   gateway  → FastAPI: REST + STOMP WebSocket + Kafka consumer + watchdog
#   worker   → Python + Stockfish
#   postgres → games and analysed moves (kept on a Docker volume)
#   kafka    → job queue between gateway and worker (single node, KRaft)
#
# Start / update (from the repo root on the VM):
#   git lfs pull                                   # Stockfish binary
#   docker compose --env-file deploy/.env -f docker-compose.prod.yml up -d --build
#
# Everything restarts automatically when the VM boots.

name: chess-reviewer-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in deploy/.env}
      FRONTEND_URL: ${FRONTEND_URL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - gateway
    mem_limit: 96m
    logging: *logging

  gateway:
    build: ./FastApi-Backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://chess:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/chess
      KAFKA_URL: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS to your Vercel URL}
      CORS_ORIGIN_REGEX: ${CORS_ORIGIN_REGEX:-}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      RATE_LIMIT_SALT: ${RATE_LIMIT_SALT:?set RATE_LIMIT_SALT}
      RATE_LIMIT_GAMES: ${RATE_LIMIT_GAMES:-5}
      MAX_PARALLEL_GAMES: ${MAX_PARALLEL_GAMES:-2}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    mem_limit: 384m
    logging: *logging

  worker:
    build: ./ai-worker
    restart: unless-stopped
    environment:
      KAFKA_URL: kafka:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      ENGINE_DEPTH: ${ENGINE_DEPTH:-16}
      ENGINE_THREADS: ${ENGINE_THREADS:-1}
      ENGINE_HASH_MB: ${ENGINE_HASH_MB:-64}
      MAX_PARALLEL_GAMES: ${MAX_PARALLEL_GAMES:-2}
    depends_on:
      kafka:
        condition: service_healthy
    mem_limit: 1g
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: chess
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 320m
    logging: *logging

  # Kafka only carries short-lived jobs; everything that matters is in
  # Postgres, and the gateway's watchdog re-queues unfinished games after a
  # restart — so the broker needs no persistent volume.
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9092 || bash -c '</dev/tcp/localhost/9092'"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 30
    mem_limit: 900m
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
