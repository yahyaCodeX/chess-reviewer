spring.application.name=chess-review-api

# ==========================================
# POSTGRESQL (AIVEN)
# ==========================================
# Replace this URL with your Aiven Postgres Service URI. Make sure it ends in ?sslmode=require
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chessdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# KAFKA (AIVEN)
# ==========================================
# Replace this with your Aiven Kafka Service URI
spring.kafka.bootstrap-servers=chess-kafka-siddiquiyahya796-e171.b.aivencloud.com:23581
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Aiven Security Settings (Required for SSL)
spring.kafka.properties.security.protocol=SSL
spring.kafka.properties.ssl.truststore.type=PEM
spring.kafka.properties.ssl.keystore.type=PEM

# Point Spring Boot to your downloaded certificates
spring.kafka.properties.ssl.truststore.certificates=classpath:certs/ca.pem
spring.kafka.properties.ssl.keystore.certificate.chain=classpath:certs/service.cert
spring.kafka.properties.ssl.keystore.key=classpath:certs/service.key